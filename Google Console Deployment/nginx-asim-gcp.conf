server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /opt/asim-gcp/certs/cert.pem;
    ssl_certificate_key /opt/asim-gcp/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    # Bridge auto-update bundle (no auth — URL is not secret; firewall restricts source IP)
    location /bridge/ {
        alias /opt/asim-gcp/bridge-bundle/;
        default_type application/zip;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
